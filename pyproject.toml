[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mauberesec"
version = "1.0.0"
description = "MaubereSec AI — terminal-first AI security assessment agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "structlog>=24.1",
  "mcp>=1.0",
]

[project.scripts]
mauberesec = "mauberesec.cli.app:run"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "respx>=0.21",
  "jsonschema>=4.22",
]

[tool.hatch.build.targets.wheel]
packages = ["mauberesec"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
# Late imports are deliberate in the CLI entrypoint: subcommand modules import
# the app, so importing them at module top would create a cycle.
"mauberesec/cli/app.py" = ["E402", "I001"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["mauberesec"]

[[tool.mypy.overrides]]
module = "mauberesec.tools.apk.container.apk_analyzer"
# The container-fallback import of the sibling axml module is intentional.
disable_error_code = ["import-not-found"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "security: security-relevant behavior tests",
  "integration: tests touching external systems (mocked or containers)",
]
